<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Dashboard</h1>
            <button class="logout">Abmelden</button>
        </header>
        
        <div class="dashboard-content">
            <div class="card">
                <h2>Willkommen!</h2>
                <p>Dies ist dein Dashboard. Hier werden alle wichtigen Informationen angezeigt.</p>
            </div>
            
            <div class="card">
                <h3>Statistiken</h3>
                <ul>
                    <li>Benutzer: 150</li>
                    <li>Projekte: 25</li>
                    <li>Tasks: 42</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
